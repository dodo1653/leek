<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f7931a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#0a1628" stroke="url(#grad)" stroke-width="3"/>
  
  <!-- Quantum orbit rings -->
  <ellipse cx="100" cy="100" rx="85" ry="40" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.3" transform="rotate(-30 100 100)"/>
  <ellipse cx="100" cy="100" rx="85" ry="40" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.3" transform="rotate(30 100 100)"/>
  <ellipse cx="100" cy="100" rx="85" ry="40" fill="none" stroke="#f7931a" stroke-width="1" opacity="0.3" transform="rotate(90 100 100)"/>
  
  <!-- Qubit dots on orbits -->
  <circle cx="30" cy="70" r="4" fill="#00d4ff" filter="url(#glow)"/>
  <circle cx="170" cy="70" r="4" fill="#f7931a" filter="url(#glow)"/>
  <circle cx="100" cy="15" r="4" fill="#00d4ff" filter="url(#glow)"/>
  
  <!-- Bitcoin B symbol -->
  <text x="100" y="125" font-family="Arial,sans-serif" font-size="80" font-weight="bold" fill="url(#grad)" text-anchor="middle" filter="url(#glow)">₿</text>
  
  <!-- Q for Quantum -->
  <text x="145" y="70" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#00d4ff" text-anchor="middle" filter="url(#glow)">Q</text>
</svg>